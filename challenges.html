<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Challenges · Wellnest</title>
  <meta name="description" content="Browse Wellnest wellness challenges for movement, hydration, mindfulness, healthy habits and daily wellness. Search, filter and join in one click.">
  <meta name="theme-color" content="#1A1D26">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="static/assets/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="static/assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="static/css/main.css">
  <link rel="stylesheet" href="static/css/components.css">
  <link rel="stylesheet" href="static/css/pages.css">
  <link rel="stylesheet" href="static/css/responsive.css">
  <script src="static/js/theme-init.js"></script>
  <script type="module" src="static/js/pages/challenges.js"></script>
</head>
<body data-page="challenges">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main" class="site-main" tabindex="-1">
    <div class="container">
      <section class="page-intro" aria-labelledby="page-title">
        <div class="page-intro__text">
          <p class="eyebrow">Discover</p>
          <h1 id="page-title">Find a challenge that fits your week</h1>
          <p class="lead">From step sprints to screen-free evenings, every challenge has a clear target, a reward and a friendly community. Join as many as you like.</p>
        </div>
        <dl class="intro-stats" data-intro-stats>
          <div><dt>Open now</dt><dd data-intro-stat="open">—</dd></div>
          <div><dt>Joined by you</dt><dd data-intro-stat="joined">—</dd></div>
          <div><dt>Points on offer</dt><dd data-intro-stat="points">—</dd></div>
        </dl>
      </section>

      <section class="spotlight-section" aria-labelledby="spotlight-title">
        <h2 id="spotlight-title" class="visually-hidden">Featured challenge</h2>
        <div data-spotlight><div class="skeleton skeleton--card"></div></div>
      </section>

      <section class="browse" aria-labelledby="browse-title">
        <div class="section-header">
          <div>
            <h2 id="browse-title" class="section-title">All challenges</h2>
          </div>
        </div>

        <form class="toolbar" role="search" aria-label="Filter challenges" data-filters>
          <div class="search-input toolbar__search">
            <svg class="icon" aria-hidden="true"><use href="static/assets/icons/sprite.svg#search"></use></svg>
            <label for="challenge-search" class="visually-hidden">Search challenges</label>
            <input class="input" type="search" id="challenge-search" name="q" placeholder="Search by name, activity or category" autocomplete="off" maxlength="60">
          </div>
          <div class="field field--inline">
            <label for="challenge-status">Status</label>
            <select class="select" id="challenge-status" name="status">
              <option value="all">All statuses</option>
              <option value="active">Active</option>
              <option value="upcoming">Upcoming</option>
              <option value="joined">Joined by me</option>
              <option value="completed">Ended</option>
              <option value="archived">Archived</option>
            </select>
          </div>
          <div class="field field--inline">
            <label for="challenge-sort">Sort by</label>
            <select class="select" id="challenge-sort" name="sort">
              <option value="popularity">Most popular</option>
              <option value="points">Highest reward</option>
              <option value="duration">Shortest duration</option>
              <option value="ending">Ending soon</option>
              <option value="newest">Newest</option>
            </select>
          </div>
        </form>

        <div class="chip-row category-chips" role="group" aria-label="Filter by category" data-category-chips></div>

        <p class="results-count" aria-live="polite" data-results-count></p>

        <div class="card-grid" data-challenge-grid>
          <div class="skeleton skeleton--card"></div>
          <div class="skeleton skeleton--card"></div>
          <div class="skeleton skeleton--card"></div>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <div id="sr-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
