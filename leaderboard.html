<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaderboard · Wellnest</title>
  <meta name="description" content="Weekly, overall and challenge-specific Wellnest leaderboards with points, activities, streaks and rank movement.">
  <meta name="theme-color" content="#1A1D26">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="static/assets/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="static/assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="static/css/main.css">
  <link rel="stylesheet" href="static/css/components.css">
  <link rel="stylesheet" href="static/css/pages.css">
  <link rel="stylesheet" href="static/css/responsive.css">
  <script src="static/js/theme-init.js"></script>
  <script type="module" src="static/js/pages/leaderboard.js"></script>
</head>
<body data-page="leaderboard">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main" class="site-main" tabindex="-1">
    <div class="container">
      <section class="page-intro page-intro--compact" aria-labelledby="page-title">
        <div class="page-intro__text">
          <p class="eyebrow">Community</p>
          <h1 id="page-title">Leaderboard</h1>
          <p class="lead">Celebrating consistency across the community. Rankings are calculated live from logged activities and completed challenges.</p>
        </div>
      </section>

      <div class="leaderboard-controls">
        <div class="segmented" role="tablist" aria-label="Leaderboard type" data-scope-tabs>
          <button type="button" role="tab" id="tab-weekly" aria-selected="true" aria-controls="leaderboard-panel" data-scope="weekly">Weekly</button>
          <button type="button" role="tab" id="tab-overall" aria-selected="false" aria-controls="leaderboard-panel" data-scope="overall" tabindex="-1">Overall</button>
          <button type="button" role="tab" id="tab-challenge" aria-selected="false" aria-controls="leaderboard-panel" data-scope="challenge" tabindex="-1">By challenge</button>
        </div>
        <div class="leaderboard-controls__filters">
          <div class="field field--inline" data-challenge-picker hidden>
            <label for="leaderboard-challenge">Challenge</label>
            <select class="select" id="leaderboard-challenge" name="challenge"></select>
          </div>
          <div class="search-input">
            <svg class="icon" aria-hidden="true"><use href="static/assets/icons/sprite.svg#search"></use></svg>
            <label for="leaderboard-search" class="visually-hidden">Search participants</label>
            <input class="input" type="search" id="leaderboard-search" placeholder="Search participants" autocomplete="off" maxlength="40">
          </div>
        </div>
      </div>

      <div id="leaderboard-panel" role="tabpanel" aria-labelledby="tab-weekly" data-leaderboard-panel>
        <div class="podium-skeleton">
          <div class="skeleton skeleton--card"></div>
          <div class="skeleton skeleton--card"></div>
          <div class="skeleton skeleton--card"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <div id="sr-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
